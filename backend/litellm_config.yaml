# LiteLLM Proxy Configuration
# Run with: litellm --config litellm_config.yaml --port 4000
#
# BYOK (Bring Your Own Key) Support:
#   Each model has `configurable_clientside_auth_params: ["api_key"]`
#   This allows the backend to pass the user's API key per-request
#   via the request body. LiteLLM forwards it to the provider.
#
# Environment Variable Fallback:
#   `api_key: os.environ/...` ensures LiteLLM falls back to server env vars
#   if a request does not specify an explicit API key.

model_list:
  # ─── Wildcards (Allow any model name for each provider) ───
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: "gemini/*"
    litellm_params:
      model: "gemini/*"
      api_key: os.environ/GOOGLE_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: "google_genai/*"
    litellm_params:
      model: "google_genai/*"
      api_key: os.environ/GOOGLE_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: "groq/*"
    litellm_params:
      model: "groq/*"
      api_key: os.environ/GROQ_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  # ─── Direct Aliases (Short names) ───
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY
      configurable_clientside_auth_params: ["api_key"]

  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      configurable_clientside_auth_params: ["api_key"]

general_settings:
  allow_client_side_credentials: true

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120
